name: Build 90DaX Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        id: build_apk
        continue-on-error: true
        run: gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Upload build log on failure
        if: steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: 90DaX-build-log
          path: android/build.log
      - name: Stop on build failure
        if: steps.build_apk.outcome == 'failure'
        run: exit 1
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 90DaX-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
